# https://cjerrington.codeberg.page/eleventy-base-blog-site/blog/codebergpagesbuild/
#
# This file would typically be .woodpecker.yml in the root of your repository.
#
#
# SECRETS
# https://woodpecker-ci.org/docs/usage/secrets
# CBTOKEN needs a codeberg access token as secret in woodpecker config
# CBMAIL with email address for git config
# SOURCEREPO must be replaced with the source repo
# DESTREPO must be replaced with the target codeberg pages repo
# CBUSERNAME must be replaced with the user/org
#
#
# We also assume a domains file in the source repo that gets copied to
# .domains in the target repo so codeberg pages works for custom domains
#

steps:
  - name: clone-pages
    when:
        event: [ push, manual ]
        branch: develop
    environment:
      # secrets must be set in Woodpecker configuration
      CBTOKEN:
        from_secret: cbtoken
    image: alpine/git
    commands:
      # Avoid permission denied errors
      - chmod -R a+w .
      # Set up git in a working way
      - git config --global --add safe.directory /woodpecker/src/codeberg.org/kRxZy_kRxZy/ampmod/amp-build
      - git config --global user.email "no@thankyou.com"
      - git config --global user.name "CI Builder"
      - npm ci
      - npm run ci-build
      # clone and move the target repo
      - git clone -b pages https://$CBTOKEN@codeberg.org/kRxZy_kRxZy/pages.git amp-build
      - chmod -R a+w amp-build
      - ccd 
  - name: install
    when:
        event: [ push, manual ]
        branch: develop
    image: node:20-trixie-slim
    commands:
      - apt-get update && apt-get install python3 default-jre-headless --no-install-recommends -y
      - npm ci
  - name: build-monorepo
    when:
        event: [ push, manual ]
        branch: develop
    image: node:20-trixie-slim
    commands:
      # Don't specify CBP build mode since redirects aren't properly implemented in canary
      - npm run ci-build
      # Only needed for custom domains
      # - cp domains build/.domains
  - name: push
    when:
        event: [ push, manual ]
        branch: develop
    image: alpine/git
    environment:
      # secrets must be set in Woodpecker configuration
      CBTOKEN:
        from_secret: cbtoken
    commands:
      # Set up git in a working way
      - git config --global --add safe.directory /woodpecker/src/codeberg.org/kRxZy_kRxZy/ampmod/amp-build
      - git config --global user.email "no@thankyou.com"
      - git config --global user.name "CI Builder"
      # Navigate to the canary build directory
      - cd ./amp-build
      # Remove all previous files, then copy in the new build
      - git rm -rf ./*
      - cp -a ../packages/gui/build/. .
      - git add --all
      - git commit -m "Woodpecker CI Build at $( env TZ=America/Chicago date +'%Y-%m-%d %X %Z' )"
      - git push -f -u origin pages