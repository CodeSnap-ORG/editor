steps:
  - name: clone-pages; image: alpine/git; commands: ["chmod -R a+w . && git config --global --add safe.directory /woodpecker/src/codeberg.org/kRxZy_kRxZy/ampmod/amp-build && git config --global user.email 'no@thankyou.com' && git config --global user.name 'CI Builder' && git clone -b pages https://$CBTOKEN@codeberg.org/kRxZy_kRxZy/pages.git amp-build && chmod -R a+w amp-build"]
  - name: install; image: node:20-trixie-slim; commands: ["apt-get update && apt-get install python3 default-jre-headless --no-install-recommends -y && npm ci && npm run ci-build"]
  - name: push; image: alpine/git; commands: ["git config --global --add safe.directory /woodpecker/src/codeberg.org/kRxZy_kRxZy/ampmod/amp-build && git config --global user.email 'no@thankyou.com' && git config --global user.name 'CI Builder' && cd ./amp-build && git rm -rf ./* && cp -a ../packages/gui/build/. . && git add --all && git commit -m \"Woodpecker CI Build at $(env TZ=America/Chicago date +'%Y-%m-%d %X %Z')\" && git push -f -u origin pages"]
