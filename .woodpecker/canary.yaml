steps: [{name: build-deploy, image: node:20-trixie-slim, environment: {CBTOKEN: {from_secret: cbtoken}}, commands: ["apt-get update && apt-get install -y python3 default-jre-headless --no-install-recommends", "npm ci", "NODE_ENV=production BUILD_MODE=canary npm run ci-build", "git config --global user.email 'no@thankyou.com'", "git config --global user.name 'CI Builder'", "git clone -b pages https://$CBTOKEN@codeberg.org/kRxZy_kRxZy/pages.git amp-build", "rm -rf amp-build/*", "cp -a packages/gui/build/. amp-build/", "cd amp-build", "git add --all", "git commit -m \"CI Build at $(date +'%Y-%m-%d %H:%M:%S')\"", "git push -f origin pages"]}]
